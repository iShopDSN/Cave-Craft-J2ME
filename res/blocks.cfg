;Файл инициализации описания свойств стандартного набора блоков CaveCraft
;Все описанные здесь блоки могут отображаться на карте.

;Устанавливаем количество блоков
RESET_BLOCKS 124

;Описание команды установки блока:
;SET_BLOCK [id] [tex] [hp] [coll] [tool] [lvl] [flags] [tr] [li]
;id - индентификатор блока.
;tex - номер текстуры блока из terrain.png. 
;hp - прочность блока.
;coll - тип коллизии:
;	0 - проходимый
;	1 - полностью твёрдый
;tool - тип инструмента необходимый для "правильной" поломки болка.
;lvl - минимальный уровень инструмента необходимый для "правильной" поломки блока:
;	0 - руки
;	1 - дерево
;	2 - камень
;	3 - железо
;	4 - золото
;	5 - алмазы
;flags - битовые флаги:
;	b001 - объект (полу)прозрачный
;	b010 - рисовать за/перед игроком
;	b100 - можно устанавливать поверх этого блока
;tr - уровень светопоглощения
;li - уровень светоизлучения

