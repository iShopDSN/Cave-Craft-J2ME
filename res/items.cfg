;Файл инициализации стандартного набора предметов CaveCraft
;Все перечисленные здесь предметы могут отбражаться в инвентаре игрока.

;Устанавливаем количество предметов
RESET_ITEMS 222

;Описание команды установки предмета:
;SET_ITEM [id] [type] [tex] [max] [prt] [flags]
;id - индентификатор предмета.
;type - тип предмета:
;	0 - блок
;	1 - инструмент
;	2 - зарезервировано
;	3 - обычный предмет
;tex - номер текстуры, зависит от типа предмета.
;max - максимальное количество предметов в стаке.
;prt - указатель на структуру дополнительных данных выбраного типа предмета.
;flags - битовое поле:
;	b0001 - рисовать цифровой индикатор
;	b0010 - рисовать графический индикатор
;	b0100 - предмет делимый
;	b1000 - рисовать текстуру из terrain.png(0)/items.png(1)


