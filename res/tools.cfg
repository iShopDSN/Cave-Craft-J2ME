;Файл инициализации описания свойств стандартного набора инструментов CaveCraft

;Устанавливаем количество инструментов
RESET_TOOLS 28

;Описание команды установки инструмента:
;SET_TOOL [id] [tool] [lvl] [speed] [damg]
;id - идентификатор инструмента.
;tool - тип инструмента.
;lvl - уровень инструмента.
;speed - скорость инструмента.
;damg - урон наносимый инструментом.

;Null
SET_TOOL 0 0 0 0 1
;Кирки
SET_TOOL 1 1 1 2 1
SET_TOOL 2 1 2 3 1
SET_TOOL 3 1 3 4 1
SET_TOOL 4 1 5 6 1
SET_TOOL 5 1 4 6 1
;Лопаты
SET_TOOL 6 2 1 2 1
SET_TOOL 7 2 2 3 1
SET_TOOL 8 2 3 4 1
SET_TOOL 9 2 5 6 1
SET_TOOL 10 2 4 6 1
;Топоры
SET_TOOL 11 3 1 2 1
SET_TOOL 12 3 2 3 1
SET_TOOL 13 3 3 4 1
SET_TOOL 14 3 5 6 1
SET_TOOL 15 3 4 6 1
;Ножницы
SET_TOOL 16 4 1 5 1
;Мечи
SET_TOOL 17 5 1 2 4
SET_TOOL 18 5 2 3 5
SET_TOOL 19 5 3 4 6
SET_TOOL 20 5 5 6 7
SET_TOOL 21 5 4 6 4
;Удочка
SET_TOOL 22 0 0 0 1
;Огниво
SET_TOOL 23 0 0 0 1
;Мотыги
SET_TOOL 24 6 1 2 1
