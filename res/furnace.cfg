;Файл инициализации описания топлива и рецептов для печи

;Устанавливаем количество топлива и рецептов
RESET_FUELS 24
RESET_RECIPES 15

;Описание команды установки топлива:
;SET_FUEL [id] [item] [time]
;id - идентификатор топлива.
;item - идентификатор предмета, который может быть использован как топливо.
;time - время горения топлива в мс(1/1000 секунды).

;Описание команды установки рецепта:
;SET_RECIPE [id] [in] [out]
;id - идентификатор рецепта.
;in - идентификатор предмета из которого присходит приготовление.
;out - идентификатор результирующего предмета.

;======[Топливо]======
;Ведро лавы
SET_FUEL 0 173 1000000
;Уголь
SET_FUEL 1 160 80000
;Доски
SET_FUEL 2 4 15000
SET_FUEL 3 94 15000
;Саженец
SET_FUEL 4 52 5000
SET_FUEL 5 114 5000
SET_FUEL 6 115 5000
;Палка
SET_FUEL 7 127 5000
;Забор
SET_FUEL 8 92 15000
SET_FUEL 9 93 15000
;Люк
SET_FUEL 10 107 15000
SET_FUEL 11 108 15000
;Дерево
SET_FUEL 12 9 15000
SET_FUEL 13 75 15000
SET_FUEL 14 83 15000
SET_FUEL 15 84 15000
SET_FUEL 16 85 15000
SET_FUEL 17 86 15000
;Верстак
