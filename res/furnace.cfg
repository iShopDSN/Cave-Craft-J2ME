SET_FUEL 23 90 15000
SET_FUEL 24 91 15000

;======[Рецепты]======
;Песок -> стекло
SET_RECIPE 0 7 31
;Железная руда -> железный слиток
SET_RECIPE 1 17 164
;Золотая руда -> золотой слиток
SET_RECIPE 2 16 165
;Комок глины -> кирпич
SET_RECIPE 3 169 163
;Сырая свинина -> жареная свинина
SET_RECIPE 4 188 189
;Булыжник -> камень
SET_RECIPE 5 5 3
;Сырая курица -> жареная курица
SET_RECIPE 6 203 204
;Сырая говядина -> жареная говядина
SET_RECIPE 7 199 200
;Сырая рыба -> жареная рыба
SET_RECIPE 8 210 211
;Дерево -> уголь
SET_RECIPE 9 9 160
;Берёза -> уголь
SET_RECIPE 10 83 160
;Ель -> уголь
SET_RECIPE 11 85 160
;Угольная руда -> уголь
SET_RECIPE 12 18 160
;Красная руда -> красная пыль
SET_RECIPE 13 20 161
